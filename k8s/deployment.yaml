apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops-demo
  namespace: devsecops-demo
  labels:
    app.kubernetes.io/name: devsecops-demo
    app.kubernetes.io/part-of: devops-s17-devsecops-demo
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0        # never go below 2 ready pods during a rollout
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devsecops-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devsecops-demo
        app.kubernetes.io/part-of: devops-s17-devsecops-demo
    spec:
      automountServiceAccountToken: false    # the app never talks to the K8s API
      imagePullSecrets:
        - name: ghcr-pull                    # created by the deploy job from GITHUB_TOKEN
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # The pipeline replaces ":__TAG__" with "@sha256:<digest>" of the image it just pushed
          # (deploying by digest = exactly the image that passed the security gate)
          image: ghcr.io/arjunaggarwal-scaler/devops-s17-devsecops-demo:__TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5001
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp              # gunicorn worker heartbeat files
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
